name: Build textbook outputs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify bundled font files
        run: sha256sum --check fonts/SHA256SUMS.txt

      - name: Compile with XeLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          texlive_version: 2025
          compiler: latexmk
          latexmk_use_xelatex: true
          args: -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: textbook-template-pdf
          path: main.pdf
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify bundled font files
        run: sha256sum --check fonts/SHA256SUMS.txt

      - name: Install TeX4ht tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-lang-chinese texlive-plain-generic
          command -v make4ht

      - name: Build HTML pages
        shell: pwsh
        run: .\build.ps1 -Format html -Engine xelatex

      - name: Build EPUB 3
        shell: pwsh
        run: .\build.ps1 -Format epub -Engine xelatex

      - name: Upload HTML pages
        uses: actions/upload-artifact@v4
        with:
          name: textbook-template-html
          path: build/html
          if-no-files-found: error

      - name: Upload EPUB
        uses: actions/upload-artifact@v4
        with:
          name: textbook-template-epub
          path: build/main.epub
          if-no-files-found: error
